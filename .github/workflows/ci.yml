name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv run poe install-deps

      - name: Run all CI checks (lint + type + pytest)
        env:
          # Push-to-main runs are checked out on main; this hook only guards local commits.
          # uv-audit runs in its own non-blocking step below.
          SKIP: no-commit-to-branch,uv-audit
        run: uv run poe test-all

      - name: Dependency vulnerability audit (non-blocking)
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: uv run poe test-audit
