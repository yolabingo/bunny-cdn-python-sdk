version: 2
updates:
  # Python dependencies (pyproject.toml + uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "America/Denver"
    # Wait 3 days after a release before proposing it (supply-chain safety)
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    allow:
      - dependency-type: "all"
    groups:
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "America/Denver"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    labels:
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"

  # prek hooks (.pre-commit-config.yaml; local hooks are skipped)
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "America/Denver"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      prek-hooks:
        patterns: ["*"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(hooks)"
      include: "scope"
